    <script>
      // Protege contra extensões do navegador (ex: VPN/Adblock) que tentam sobrescrever window.fetch
      // quando o ambiente define fetch apenas com getter (TypeError: Cannot set property fetch of #<Window>)
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (!desc || desc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              }
            });
          }
        } catch (_err) {
          // Ignora caso o descritor seja estritamente selado
        }

        window.addEventListener(
          'error',
          function (event) {
            if (
              (event && event.filename && event.filename.indexOf('chrome-extension://') === 0) ||
              (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1)
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();

      // Desativa ServiceWorker antigo em ambiente de preview/dev para evitar interceptação de módulos Vite
      (function () {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) {
              r.unregister();
            });
          });
        }
      })();
    </script>
